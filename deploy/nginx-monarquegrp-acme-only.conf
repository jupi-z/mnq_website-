# Temporary, content-free HTTP vhost used only to obtain/renew the SAN TLS
# certificate while legal and editorial release gates are still open.
# Replace this with nginx-monarquegrp.conf only after release approval.
server {
    listen 80;
    listen [::]:80;
    server_name monarquegrp.com www.monarquegrp.com;

    access_log /var/log/nginx/monarquegrp-acme-access.log;
    error_log /var/log/nginx/monarquegrp-acme-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
