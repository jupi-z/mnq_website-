# Install as /etc/nginx/sites-available/monarquegrp.com only after legal and
# editorial release gates have been approved and the SAN certificate exists.
# The production document root is a release symlink owned by the deploy operator.

server {
    listen 80;
    listen [::]:80;
    server_name monarquegrp.com www.monarquegrp.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://monarquegrp.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.monarquegrp.com;

    ssl_certificate /etc/letsencrypt/live/monarquegrp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monarquegrp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    return 308 https://monarquegrp.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monarquegrp.com;

    root /var/www/monarquegrp.com/current;
    index index.html;
    charset utf-8;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/monarquegrp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monarquegrp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/monarquegrp-access.log;
    error_log /var/log/nginx/monarquegrp-error.log warn;

    # Do not apply includeSubDomains while other MonarQue subdomains have
    # independently managed TLS certificates.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Previously published institutional paths known from the repository docs.
    location = /a-propos { return 301 /fr/groupe/; }
    location = /a-propos/ { return 301 /fr/groupe/; }
    location = /mentions-legales { return 301 /fr/mentions-legales/; }
    location = /mentions-legales/ { return 301 /fr/mentions-legales/; }

    location ^~ /_next/static/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
